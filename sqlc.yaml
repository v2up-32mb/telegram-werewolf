version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations/000001_initial.sql"
    queries: "queries/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/storage/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
