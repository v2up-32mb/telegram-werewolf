# Telegram 狼人杀 Bot —— zh-CN 文案（MVP 首批）
# key 语义化命名；{{.X}} 为模板参数，渲染时默认转义。
# 私密标记约定见 docs/阶段消息设计.md §5：
# - 普通文字：Emoji + 明文（mark.*）
# - 按钮：座位号 + Emoji 短标记（button.seat），Emoji 紧贴座位号、无占位。

# 系统错误
error.generic: "出错了，请稍后重试"
error.invalid_input: "输入无效：{{.Detail}}"

# 主菜单
menu.main: |
  欢迎使用狼人杀 Bot！
  输入 /new 创建房间，/join 加入房间。

# 阶段消息
phase.night.title: "🌙 第 {{.PhaseNumber}} 夜"
phase.day.title: "☀️ 第 {{.PhaseNumber}} 天"
phase.private_record.header: "【我的私密记录】"
phase.god_view.header: "【上帝视角记录】"
phase.time_left: "本阶段限时：{{.Seconds}} 秒"

# 角色操作（临时操作提示）
action.wolf.kill.prompt: "请选择要击杀的玩家："
action.seer.check.prompt: "请选择要查验的玩家："
action.witch.save.prompt: "是否使用解药："
action.vote.prompt: "请投票给要放逐的玩家："

# 顶部通知
notice.top: "📢 {{.Message}}"

# 健康提示
health.alive: "服务运行正常"

# 普通文字私密标记（Emoji + 明文）
mark.good_seer: "🟢 好人"
mark.wolf_seer: "🐺 狼人"
mark.wolfmate: "🐺 狼队友"
mark.role.villager: "👤 平民"
mark.role.werewolf: "🐺 狼人"
mark.role.seer: "🔮 预言家"
mark.role.witch: "💊 女巫"

# 按钮短标记：座位号 + Emoji（按钮为纯文本，Emoji 紧贴座位号）
button.seat: "{{.Seat}}号{{.Mark}}"

# 身份卡
role_card.caption: "你抽到了 {{.RoleName}}！请确认你的身份。"

# 发牌确认（docs/阶段消息设计.md §6.2）
deal.confirm_prompt: |
  👁 身份确认
  ━━━━━━━━━━━━━━

  请确认你已经查看并记住自己的身份。

  当前状态：尚未确认
deal.confirm_done: |
  👁 身份确认
  ━━━━━━━━━━━━━━

  你已确认身份，请等待其他玩家。

# 狼人夜间（docs/阶段消息设计.md §夜间 2、§狼人标识）
wolf.discuss: |
  🐺 狼人讨论 · 第 {{.Round}} 轮

  狼队友：{{.WolfMates}}

  选择并确认今晚的击杀目标（可击杀任意存活玩家，包括自己和狼队友）。
wolf.vote: |
  {{.Prompt}}
  第 {{.Round}} 轮

  {{.Targets}}

  选择后请点击「确认选择」，确认后本轮不能修改。
wolf.vote.locked: "你已确认{{.Target}}，本轮不能修改。"
wolf.tie: "⚠️ 出现平票，进入第 {{.Round}} 轮投票。"

# 女巫夜间（docs §夜间 3、§8.2 女巫）
action.witch.poison.prompt: "请选择要毒杀的玩家（或不使用毒药）："
witch.potion.available: "可用"
witch.potion.used: "已用"
witch.peace_night: "平安夜"
witch.kill_reveal: "今晚狼人选择的目标：{{.Target}}"
witch.save.prompt: |
  {{.Prompt}}
  解药：{{.SaveStatus}}
  毒药：{{.PoisonStatus}}

  选择后请点击「确认选择」，确认后不能修改。
witch.poison.prompt: |
  {{.Prompt}}
  {{.Targets}}
  [不使用毒药]
  解药：{{.SaveStatus}}
  毒药：{{.PoisonStatus}}

  选择后请点击「确认选择」，确认后不能修改。
witch.save.locked: "你已确认{{.Choice}}。"
witch.poison.locked: "你已确认{{.Choice}}。"
witch.none: "已按默认选择处理：本夜不使用任何药品。"
witch.choice.save_used: "使用解药"
witch.choice.save_not_used: "不使用解药"
witch.choice.poison_used: "毒杀 {{.Seat}}"
witch.choice.poison_not_used: "不使用毒药"

# 预言家夜间（docs §夜间 4、§8.3 预言家、§5 私密标记）
seer.prompt: |
  {{.Prompt}}
  {{.Targets}}

  选择后请点击「确认查验」，确认后立即返回结果。
seer.result: "查验结果：{{.Target}} · {{.Mark}}"
seer.none: "已按默认选择处理：本轮未查验任何玩家。"
