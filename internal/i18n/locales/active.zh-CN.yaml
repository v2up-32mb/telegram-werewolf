# 白天投票（docs 游戏流程设计.md §投票、阶段消息设计.md §8.4、
# §3.3 时间文案；§4.3 长度不变量）
vote.prompt: |
  {{.Prompt}}
  {{.Targets}}
  [弃权]

  选择后请点击「确认投票」，确认前可修改，确认后锁定。
  截止时刻：{{.Deadline}}
vote.locked: "你已确认{{.Target}}，本轮不能修改。"
vote.detail: |
  📊 投票明细
  {{.Lines}}
vote.tally: |
  🗳 票数统计
  {{.Lines}}
vote.result: "⚖️ 放逐结果：{{.Target}}"
vote.result.none: "⚖️ 放逐结果：无人被放逐"
vote.delete: "投票消息已结束"

# 平票（docs 游戏流程设计.md §投票 4、阶段消息设计.md §8.5 平票；
# 真实平票不再输出 vote.result，平票过程全部追加当天白天主消息）
tie.speech: |
  ⚖️ 出现平票：{{.Candidates}}。
  📣 平票玩家依次加时发言，随后进行第 2 次投票。
tie.speech_turn: |
  🎙 加时发言 · {{.Seat}}
  请在 {{.Deadline}} 前结束发言。
tie.runoff: |
  🔁 第 2 次投票：仅在平票玩家 {{.Candidates}} 中投票。
tie.runoff_prompt: |
  🗳 第 2 次投票 · {{.Seat}}
  {{.Targets}}

  选择后请点击「确认投票」，确认后锁定。
  截止时刻：{{.Deadline}}
tie.no_speech: |
  🗳 第 {{.Round}} 轮无发言投票：仅在平票玩家间投票。
  平票候选：{{.Candidates}}
tie.final: |
  ⚔️ 最终对决：{{.Candidates}}
  禁止弃权，必须投其中一人。
tie.duel_prompt: |
  ⚔️ 最终对决 · {{.Seat}}
  {{.Targets}}

  禁止弃权，必须投其中一人。
  截止时刻：{{.Deadline}}
tie.duel_excluded: "🎲 座位 {{.Seat}} 本轮被排除出投票（仅本轮失去投票权，不死亡、不影响后续进程）。"

# 遗言（docs 游戏流程设计.md §结算 4、§死亡玩家 4：遗言正常转播）
last_words.prompt: |
  💬 遗言 · {{.Seat}}
  你已被放逐，可在 30 秒内发表最后的遗言。
  截止时刻：{{.Deadline}}
last_words.published: "💬 遗言（{{.Seat}}）：{{.Text}}"

# 狼人自爆与恶意退出（docs 游戏流程设计.md §狼人自爆、§恶意退出判定、
# §投票 5、§退出约束；重大事件只写当前时间段主消息，不额外发送永久事件消息）
wolves.explode: "💥 {{.Seat}} 号狼人自爆了！自爆优先，已投出的票全部作废，直接进入黑夜。"
leave.malicious: "⚠️ {{.Seat}} 号恶意退出，按死亡处理。"
leave.timeout_warning: "⏰ 你已连续超时 {{.Streak}} 次，再超时 {{.Remaining}} 次将被强制退出。"
leave.removed: "🚫 {{.Seat}} 号因连续超时被强制移除。"

# 游戏中治理（docs 游戏流程设计.md §解散、§投票踢人、§房主控制面板；
# 治理公告写当前时间段主消息，不额外发送永久事件消息）
governance.dissolve.initiated: "🗳 {{.Initiator}} 号发起了投票解散（超过三分之一同意即通过）。"
governance.dissolve.vote: "✅ 你已投同意解散票。"
governance.dissolve.passed: "⚖️ 投票解散通过，房间解散（不扣分）。"
governance.kick.initiated: "🗳 {{.Initiator}} 号发起了投票踢人（目标 {{.Target}} 号，超过三分之一同意即通过）。"
governance.kick.vote: "✅ 你已投同意踢人票。"
governance.kick.passed: "🚪 投票踢人通过，{{.Target}} 号按掉线处理被移除。"
governance.host_dissolve.confirm: "⚠️ 确认强制解散房间？将扣除 10 积分（积分 ≤9 时无法强制解散）。"
governance.host_dissolve.passed: "🏚 房主强制解散了房间（扣除 10 积分）。"

# 结算、积分、战报与再来一局（docs 游戏流程设计.md §结算、§积分系统、
# 阶段消息设计.md §15/§16：战报单独永久发送，大厅控制另发临时消息）
settlement.victory: "🏆 游戏结束，{{.Winner}} 阵营获胜！"
settlement.report: "📜 本局结算战报：{{.Winner}} 阵营获胜。参与人、全员身份与积分变化见战报详情（本局不评 MVP，只记胜负）。"
lobby.rematch: "🏠 房间已返回等待状态，沿用本局配置。「再来一局」已确认，从点击起至少保留 {{.WindowSeconds}} 秒供玩家选择退出；期间空位可等待新人加入或 AI 补位，满足开始条件后由房主开始游戏。"

# 玩家命令与帮助入口（docs 游戏流程设计.md §命令清单、§新手引导、
# §发言 4 自毁提示；命令回复一律 MarkdownV2 默认转义）
help.commands: |
  📖 命令清单：
  /start 主菜单
  /newgame 创建房间（可选自定义房间码）
  /join <房间码或邀请链接\> 加入房间
  /role 查看我的身份
  /score 查看我的积分
  /leave 退出房间
  /rank 排行榜（后续开放）
  /help 帮助
rules.intro: |
  🎮 新手规则：
  狼人夜晚选择击杀目标；好人白天投票放逐狼人。
  神职或村民全灭（屠边）或好人全灭（屠城）时狼人获胜，
  狼人全灭时好人获胜；胜负按行动顺序即时判定。
  胜利 \+5 分，对局中死亡但阵营胜利 \+2 分，失败 0 分，
  恶意退出按规则扣分或不得分。
speech.self_destruct_hint: |
  ⚠️ 发言提示：你的发言消息（无论是否成功转发）将在 3 秒后自动
  删除，防止消息堆积顶掉阶段消息。

# 白天发言（B1-d 导演接线补齐；docs 游戏流程设计.md §白天、§发言限制、
# 阶段消息设计.md §10：控制消息/转播/拒绝反馈；原消息 3 秒自毁）
speech.turn: |
  🎙 轮到你发言（{{.Seat}}）
  每条最多 50 单位、本回合最多 5 条。

  已发送：{{.Sent}} / {{.Total}} 条
  截止时刻：{{.Deadline}}
speech.accepted: "🗣 {{.Speaker}}：{{.Text}}"
speech.rejected: "⚠️ {{.Reason}}"
speech.time_left: "⏳ 发言时间即将结束，请尽快点「结束发言」。"
