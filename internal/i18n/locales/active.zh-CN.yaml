witch.choice.poison_not_used: "不使用毒药"

# 预言家夜间（docs §夜间 4、§8.3 预言家、§5 私密标记）
seer.prompt: |
  {{.Prompt}}
  {{.Targets}}

  选择后请点击「确认查验」，确认后立即返回结果。
seer.result: "查验结果：{{.Target}} · {{.Mark}}"
