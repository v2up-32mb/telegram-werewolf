# 主菜单（docs 游戏流程设计.md §一.6：/start 出主菜单，/newgame 直接建）
menu.main: |
  🏠 欢迎使用狼人杀 Bot！

  输入 /newgame 创建房间，/join 加入房间。
  其他命令：/role 身份、/score 积分、/leave 退出、/rank 排行榜（后续开放）、/help 帮助。

