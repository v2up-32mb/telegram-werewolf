# 狼人夜间（docs/阶段消息设计.md §夜间 2、§狼人标识）
wolf.discuss: |
  🐺 狼人讨论 · 第 {{.Round}} 轮

  狼队友：{{.WolfMates}}

  选择并确认今晚的击杀目标（可击杀任意存活玩家，包括自己和狼队友）。
