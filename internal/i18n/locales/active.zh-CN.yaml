# Telegram 狼人杀 Bot —— zh-CN 文案（MVP 首批）
# key 语义化命名；{{.X}} 为模板参数，渲染时默认转义。
# 私密标记约定见 docs/阶段消息设计.md §5：
# - 普通文字：Emoji + 明文（mark.*）
